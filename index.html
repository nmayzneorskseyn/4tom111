</style></head><body><header><h1>MAGIST PRO · М111 Химия</h1><p>IV том · Н. Л. Глинка «Общая химия» · XVII–XXII тараулар · §197–247</p></header><main><section class="panel"><div class="controls"><label for="chapter">Тарау:</label><select id="chapter"></select><label for="mode">Режим:</label><select id="mode"><option value="quiz">Quiz · бірден тексеру</option><option value="test">Test · соңында бағалау</option></select><button id="restart" class="secondary">Қайта бастау</button></div><p class="muted" id="count"></p></section><section class="panel"><h2>Маңызды ұғымдар</h2><details><summary>Терминдерді ашу</summary><ul class="terms" id="terms"></ul></details></section><div id="questions"></div><section class="panel"><div class="controls"><button id="finish">Нәтижені көрсету</button><span id="result" class="score"></span></div><p class="muted">Бағалау: толық дұрыс жауап – 2 балл; бірнеше дұрыс жауаптың бір бөлігі ғана белгіленсе, артық қате жауапсыз – 1 балл; қалғаны – 0 балл.</p></section></main><footer>MAGIST PRO · Оқу материалы</footer><script>
const chapters=[{"number": 1, "title": "ПЕРИОДТЫҚ ЖҮЙЕНІҢ БІРІНШІ ТОБЫ", "terms": ["Сілтілік металдар: сыртқы электрондық қабатында бір электроны бар бірінші топтың негізгі топша элементтері.", "Иондану энергиясы: атомнан электронды бөліп алуға қажет энергия.", "Электролиз: электр тогының әсерінен жүретін электродтық тотығу-тотықсыздану үдерісі.", "Тотықсыздандырғыш: электрон беретін бөлшек немесе зат.", "Амальгама: сынаптың басқа металмен түзетін қорытпасы.", "Латунь: мыс пен мырыш негізіндегі қорытпа.", "Қола: мыс негізіндегі, көбіне қалайымен түзілетін қорытпа.", "Комплекс ион: орталық атом немесе ион мен оған байланысқан лигандтардан тұратын бөлшек."], "questions": [{"number": 1, "question": "Сілтілік металдар атомдарының электрондық құрылысына қатысты дұрыс тұжырымдарды таңдаңыз.", "source": "§197 | Спецификация: №1", "options": ["Сыртқы қабатында екі электрон болады", "Сыртқы қабатында бір электрон болады", "Бір электрон бергенде бір зарядты катион түзеді", "Электрон қосып алып тұрақты анион түзеді", "Натрий катионының электрондық құрылысы неонға сәйкес келеді", "Валенттік қабаты толығымен сегіз электроннан тұрады", "Литий катионының электрондық құрылысы аргонға сәйкес келеді"], "correct": [1, 2, 4], "explanation": "Сілтілік металдар сыртқы бір электронын оңай беріп, инертті газға ұқсас электрондық құрылымды катион түзеді."}, {"number": 2, "question": "Сілтілік металдардың табиғатта кездесуіне қатысты дұрыс пікірлерді анықтаңыз.", "source": "§197 | Спецификация: №6", "options": ["Натрий табиғатта негізінен бос металл ретінде жиналады", "Калийдің маңызды табиғи қосылыстарының бірі хлориді болып табылады", "Натрий хлориді теңіз суында кездеседі", "Рубидий мен цезий кең таралған таза металл кендерін түзеді", "Сілтілік металдар табиғатта негізінен қосылыс күйінде болады", "Францийдің барлық белгілі изотоптары тұрақты болады", "Натрий табиғатта қосылыс түзе алмайды"], "correct": [1, 2, 4], "explanation": "Белсенді сілтілік металдар табиғатта қосылыстар түрінде кездеседі; NaCl теңіз суында, ал калий тұздары минералдарда болады."}, {"number": 3, "question": "Сілтілік металдарды алу тәсілдеріне сәйкес келетін тұжырымдарды таңдаңыз.", "source": "§197 | Спецификация: №5", "options": ["Натрийді балқыған қосылыстарын электролиздеу арқылы алады", "Калийді балқыған KOH немесе KCl құрамынан натриймен тотықсыздандыруға болады", "Литийді судағы LiCl ерітіндісін жай буландыру арқылы алады", "Рубидий мен цезийді хлоридтерінен кальциймен тотықсыздандыруға болады", "Натрийді ас тұзының судағы ерітіндісін салқындату арқылы алады", "Калийді KCl ерітіндісіне су қосу арқылы алады", "Литийді LiOH ерітіндісін сүзу арқылы алады"], "correct": [0, 1, 3], "explanation": "Кітапта натрий мен литий үшін балқыма электролизі, калий үшін натриймен, ал рубидий мен цезий үшін кальциймен тотықсыздандыру көрсетілген."}, {"number": 4, "question": "Сілтілік металдардың физикалық қасиеттерін сипаттайтын тұжырымдарды таңдаңыз.", "source": "§197 | Спецификация: №2", "options": ["Кристалдық торы көлемцентрленген кубтық болады", "Жаңа кесілген бетінде металдық жылтыр байқалады", "Ауада беті тотығуға байланысты тез күңгірттенеді", "Барлығы алмазға тән коваленттік тор түзеді", "Электр тогын тек ерітінді күйінде өткізеді", "Кристалдық торында еркін электрондар болмайды", "Барлығы қалыпты жағдайда газ күйінде болады"], "correct": [0, 1, 2], "explanation": "Сілтілік металдардың кристалдық торы көлемцентрленген кубтық, ал жаңа кесілген беті ауада тез тотығады."}, {"number": 5, "question": "Сілтілік металдардың сумен әрекеттесуіне қатысты дұрыс тұжырымдарды анықтаңыз.", "source": "§197 | Спецификация: №5", "options": ["Металл атомы электрон қабылдап анионға айналады", "Реакцияда металл гидроксиді түзілуі мүмкін", "Реакцияда сутек газы бөлінеді", "Металл атомы тотығады", "Сутек газы міндетті түрде оттекке айналады", "Реакция тек сусыз ортада жүреді", "Реакцияда металлдың тотығу дәрежесі нөлден минус бірге өзгереді"], "correct": [1, 2, 3], "explanation": "2M + 2H₂O → 2MOH + H₂ теңдеуінде металл тотығады, ал судағы сутек тотықсызданады."}, {"number": 6, "question": "Натрийдің химиялық қосылыстары туралы дұрыс тұжырымдарды таңдаңыз.", "source": "§198 | Спецификация: №6", "options": ["Натрий пероксидінің формуласы Na₂O₂", "Натрий гидроксиді күшті негіз болып табылады", "Натрий хлоридінің формуласы NaCl", "Натрий пероксидінде оттектің тотығу дәрежесі минус екі", "Натрий гидроксиді суда мүлде ерімейді", "Натрий хлориді коваленттік бейполяр молекулалардан тұрады", "Натрий пероксидінің формуласы NaO₃"], "correct": [0, 1, 2], "explanation": "Na₂O₂ - пероксид, NaOH - күшті негіз, NaCl - натрий хлориді."}, {"number": 7, "question": "Натрийді балқыма электролизі арқылы алу кезінде дұрыс жүретін процестерді таңдаңыз.", "source": "§198 | Спецификация: №5", "options": ["Катодта Na⁺ ионы электрон қабылдайды", "Катодта Na⁺ ионы электрон береді", "Анодта хлорид ионы электрон беруі мүмкін", "Катодта натрий металы бөлінеді", "Анодта натрий катионы міндетті түрде түзіледі", "Электролиз кезінде электрон алмасу жүрмейді", "Балқымада су молекулалары негізгі тотықсыздандырғыш болады"], "correct": [0, 2, 3], "explanation": "Балқыған NaCl электролизінде катодта Na⁺ + e⁻ → Na, анодта 2Cl⁻ → Cl₂ + 2e⁻ жүреді."}, {"number": 8, "question": "Калийдің табиғи қосылыстары мен қолданылуына қатысты дұрыс пікірлерді таңдаңыз.", "source": "§199 | Спецификация: №6", "options": ["Калий тұздары минералдық тыңайтқыш ретінде пайдаланылады", "Калий хлориді калийдің маңызды тұздарының бірі", "Калий қосылыстары өсімдіктердің қоректенуі үшін маңызды", "Калий табиғатта тек бос металл күйінде кездеседі", "Калий тыңайтқыштары тек азот атомдарынан тұрады", "Калий хлориді көмірсутекке жатады", "Калий тұздары суда ешқашан ерімейді"], "correct": [0, 1, 2], "explanation": "Кітапта табиғи калий тұздары мен олардың тыңайтқыш ретіндегі маңызы қарастырылған."}, {"number": 9, "question": "Мыс пен оның қорытпаларына қатысты дұрыс тұжырымдарды таңдаңыз.", "source": "§200 | Спецификация: №6", "options": ["Латунь негізінен мыс пен мырыштың қорытпасы", "Қола мыс негізіндегі қорытпаларға жатады", "Мыс электр өткізгіштігі жоғары металдардың бірі", "Латунь тек натрий мен калийден тұрады", "Қола міндетті түрде таза химиялық элемент болады", "Мыс токты тек еріген тұз күйінде өткізеді", "Мыс қорытпаларында металдық байланыс болмайды"], "correct": [0, 1, 2], "explanation": "Мыс жоғары электрөткізгіштігімен және латунь, қола сияқты қорытпалар түзуімен ерекшеленеді."}, {"number": 10, "question": "Мыстың тотығу дәрежелері мен қосылыстарына қатысты дұрыс пікірлерді таңдаңыз.", "source": "§200 | Спецификация: №6", "options": ["Cu₂O құрамында мыстың тотығу дәрежесі +1", "CuO құрамында мыстың тотығу дәрежесі +2", "CuSO₄ құрамында мыс +2 тотығу дәрежесінде болады", "CuO құрамында мыс +4 тотығу дәрежесінде болады", "Cu₂O құрамында оттектің тотығу дәрежесі +2", "CuSO₄ құрамында күкірттің тотығу дәрежесі -2", "Cu₂O құрамында мыс -1 тотығу дәрежесінде болады"], "correct": [0, 1, 2], "explanation": "Мыс үшін +1 және +2 тотығу дәрежелері тән; оксидтер мен сульфат осыған мысал болады."}, {"number": 11, "question": "Мыс(II) ионының аммиакпен әрекеттесуіне қатысты дұрыс тұжырымдарды таңдаңыз.", "source": "§200 | Спецификация: №6", "options": ["Аммиак мыс(II) ионымен комплекс түзе алады", "Комплекс түзілуі ерітіндінің түсін өзгертуі мүмкін", "Аммиак лиганд ретінде қатыса алады", "Комплекс түзілуі мыс атомының ядролық зарядын өзгертеді", "Комплекс түзілуінде барлық электрондар ядродан бөлініп кетеді", "Аммиак судағы барлық металл иондарын бірдей тұнбаға түсіреді", "Комплекс ионы тек бейтарап атомдардан тұрады"], "correct": [0, 1, 2], "explanation": "Аммиак мыс(II) ионымен координациялық байланысып, боялған комплекс бөлшектерін түзеді."}, {"number": 12, "question": "Күмістің химиялық қасиеттеріне қатысты дұрыс тұжырымдарды таңдаңыз.", "source": "§201 | Спецификация: №6", "options": ["Күміс хлориді суда нашар ериді", "Күміс нитраты суда еритін тұз болып табылады", "Күміс хлориді аммиакпен комплекс түзіп ери алады", "Күміс хлоридінің формуласы AgCl₂", "Күміс нитратының формуласы Ag₂NO₃", "Күміс табиғатта тек газ күйінде кездеседі", "Күміс ионының тұрақты заряды әдетте -1"], "correct": [0, 1, 2], "explanation": "AgCl - нашар еритін тұз; аммиак қатысында күмістің комплекс ионы түзілуі мүмкін."}, {"number": 13, "question": "Күміс хлоридінің аммиакта еруіне қатысты дұрыс тұжырымдарды таңдаңыз.", "source": "§201 | Спецификация: №4, №6", "options": ["Ag⁺ ионы аммиак молекулаларымен байланыса алады", "Комплекс түзілуі бос Ag⁺ концентрациясын азайта алады", "Комплекс түзілуі AgCl ерігіштік тепе-теңдігіне әсер ете алады", "Комплекс түзілуі күмістің атомдық нөмірін өзгертеді", "AgCl ерігенде хлор атомы міндетті түрде протонға айналады", "Аммиактың қосылуы ерітіндідегі барлық иондарды жояды", "AgCl ерігіштігі химиялық тепе-теңдікпен байланыспайды"], "correct": [0, 1, 2], "explanation": "[Ag(NH₃)₂]⁺ түзілуі бос Ag⁺ мөлшерін төмендетіп, AgCl еруін қолдайды."}, {"number": 14, "question": "Алтынның химиялық қасиеттеріне қатысты дұрыс пікірлерді таңдаңыз.", "source": "§202 | Спецификация: №5, №6", "options": ["Алтын химиялық белсенділігі төмен асыл металдарға жатады", "Алтын кейбір комплекс қосылыстар түзе алады", "Алтынның +1 және +3 тотығу дәрежелері кездеседі", "Алтын суға түскенде бірден сілті түзеді", "Алтынның барлық қосылыстарында тотығу дәрежесі -3", "Алтынның химиялық қасиеттері натриймен бірдей", "Алтын ауада өздігінен тұрақты гидроксид қабатын түзеді"], "correct": [0, 1, 2], "explanation": "Алтын асыл металл болғанымен, тиісті жағдайда +1 және +3 күйіндегі қосылыстар мен комплекстер түзеді."}, {"number": 15, "question": "Бірінші топтың негізгі және қосымша топшаларының айырмашылығына қатысты дұрыс тұжырымдарды таңдаңыз.", "source": "§197, §200–202 | Спецификация: №1, №6", "options": ["Натрий мен калий негізгі топшаның сілтілік металдарына жатады", "Мыс, күміс және алтын қосымша топшада қарастырылады", "Мыс пен алтынның химиялық қасиеттері сілтілік металдардан ерекшеленеді", "Натрий мен алтынның барлық қосылыстары бірдей тотығу дәрежесін көрсетеді", "Күміс пен калий табиғатта тек бірдей минералдарда кездеседі", "Мыс пен натрийдің химиялық белсенділігі бірдей", "Алтын сумен натрий сияқты қарқынды әрекеттеседі"], "correct": [0, 1, 2], "explanation": "Глинка бірінші топта сілтілік металдар мен мыс топшасын бөлек қарастырады; олардың химиялық белсенділігі мен қосылыстары ерекшеленеді."}, {"number": 16, "question": "Сілтілік металдардың сумен әрекеттесуіне сәйкес келетін тұжырымдарды таңдаңыз.", "source": "§197 | Спецификация: №5, №6", "options": ["Натрий судағы сутек иондарын тотықсыздандырып, сутек бөледі", "Натрий сумен әрекеттескенде натрий гидроксиді түзіледі", "Натрий судағы оттекті озонға айналдырады", "Калий сумен әрекеттескенде калий гидроксиді түзіледі", "Калий сумен әрекеттескенде металл күйінде тұнбаға түседі", "Натрий сумен әрекеттескенде натрий хлориді түзіледі", "Калий сумен әрекеттескенде сутек міндетті түрде сіңіріледі"], "correct": [0, 1, 3], "explanation": "Сілтілік металдар судан сутекті ығыстырып, сілті түзеді: 2Na + 2H₂O → 2NaOH + H₂↑."}, {"number": 17, "question": "Сілтілік металдардың топ бойынша қасиеттерінің өзгеруіне қатысты дұрыс тұжырымдарды таңдаңыз.", "source": "§197 | Спецификация: №1", "options": ["Литийден цезийге қарай атом радиусы кемиді", "Литийден цезийге қарай атом радиусы артады", "Төмен қарай бірінші электронды жұлып алу жеңілдейді", "Төмен қарай ядро заряды бірдей қалады", "Сыртқы электрон саны бірден екіге өседі", "Негізгі топша металдарының валенттік конфигурациясы ns¹ түрінде болады", "Төмен қарай барлық атомдардың электрон қабатының саны азаяды"], "correct": [1, 2, 5], "explanation": "Топ бойынша электрондық қабат саны өседі; сыртқы ns¹ электронды беру жалпы алғанда жеңілдейді."}, {"number": 18, "question": "Натрийдің оттекпен және галогендермен әрекеттесуін дұрыс сипаттайтын тұжырымдарды таңдаңыз.", "source": "§198 | Спецификация: №5, №6", "options": ["Натрий хлормен әрекеттес де жүреді", "Сутек сіңген палладий міндетті түрде газға айналады"], "correct": [0, 2, 3], "explanation": "§247 палладийдің өз көлемінен жүздеген есе көп сутек сіңіретінін, ісініп морттанатынын және белсенді сутек түзетінін сипаттайды."}, {"number": 30, "question": "Сутек сіңірген палладийдің тотықсыздандырғыш әсеріне қатысты дұрыс тұжырымдарды таңдаңыз.", "source": "§247 | Спецификация: №5", "options": ["Fe(III) тұздарын Fe(II) тұздарына дейін тотықсыздандыра алады", "Fe(II) тұздарын Fe(III) тұздарына дейін міндетті тотықтырады", "Галогендерді галогенсутектерге айналдыруға ықпал етеді", "SO₂ қосылысын H₂S-ке дейін тотықсыздандыруы мүмкін", "Галогенсутектерді міндетті бос галогенге айналдырады", "SO₂ құрамындағы күкірттің тотығу дәрежесін +6-ға арттырады", "Fe(III) құрамындағы темірді +4 дәрежесіне тотықтырады"], "correct": [0, 2, 3], "explanation": "§247 сутекпен қаныққан палладийдің Fe(III)→Fe(II), галоген→галогенсутек және SO₂→H₂S түрленулерін сипаттайды."}, {"number": 31, "question": "Палладийдің техникалық қолданылуына қатысты дұрыс жауаптарды таңдаңыз.", "source": "§247 | Спецификация: №6", "options": ["Сутек изотоптарын бөлуге арналған аппаратурада қолданылады", "Палладий күміспен қорытпа түзбейді", "Палладий катализатор ретінде қолданылады", "Палладий-күміс қорытпалары электр контактілерінде қолданылады", "Палладий тек асыл газ түрінде қолданылады", "Палладий барлық жағдайда катализатор ретінде белсенді емес", "Палладий сутекпен әрекеттескенде бірден толық буланады"], "correct": [0, 2, 3], "explanation": "§247 палладийдің сутекпен жұмыс істейтін аппаратурадағы, қорытпалардағы және катализдегі қолданысын атайды."}]}];
const $=id=>document.getElementById(id);const letters='ABCDEFGH';let selectedChapter=0, mode='quiz', submitted=false, answers={}, order=[];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function score(q,picked){const c=q.correct;const extras=picked.some(i=>!c.includes(i));if(extras||picked.length===0)return 0;if(picked.length===c.length&&c.every(i=>picked.includes(i)))return 2;return c.length>1?1:0}
function feedback(q,picked){const sc=score(q,picked);const right=q.correct.map(i=>q.options[i]).join('; ');return `<div class="feedback"><strong class="${sc===2?'correct':'incorrect'}">${sc===2?'Дұрыс':sc===1?'Жартылай дұрыс':'Қате'} · ${sc}/2</strong><div><b>Дұрыс жауаптар:</b> ${escapeHtml(right)}</div><div><b>Түсіндірме:</b> ${escapeHtml(q.explanation)}</div></div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let ch=chapters[selectedChapter];$('count').textContent=`${ch.title} · ${ch.questions.length} сұрақ`;$('terms').innerHTML=ch.terms.map(t=>`<li>${escapeHtml(t)}</li>`).join('');$('result').textContent='';$('questions').innerHTML=ch.questions.map((q,qi)=>{let opts=order[qi];return `<article class="question" id="q${qi}"><div class="muted">№${q.number} · ${escapeHtml(q.source)}</div><h3>${escapeHtml(q.question)}</h3>${opts.map((oi,k)=>`<label class="option"><input type="checkbox" data-q="${qi}" data-opt="${oi}" ${submitted?'disabled':''}> <span><b>${letters[k]})</b> ${escapeHtml(q.options[oi])}</span></label>`).join('')}<div id="f${qi}"></div>${mode==='quiz'?`<button class="secondary" data-check="${qi}">Тексеру</button>`:''}</article>`}).join('');$('finish').textContent=mode==='quiz'?'Жалпы нәтижені көрсету':'Тестті аяқтау'}
function reset(){answers={};submitted=false;order=chapters[selectedChapter].questions.map(q=>shuffle(q.options.map((_,i)=>i)));render()}
function getPicked(qi){return [...document.querySelectorAll(`input[data-q="${qi}"]:checked`)].map(x=>Number(x.dataset.opt))}
function checkOne(qi){if(submitted)return;let q=chapters[selectedChapter].questions[qi];answers[qi]=getPicked(qi);$('f'+qi).innerHTML=feedback(q,answers[qi]);document.querySelectorAll(`input[data-q="${qi}"]`).forEach(x=>x.disabled=true);let b=document.querySelector(`button[data-check="${qi}"]`);if(b)b.disabled=true}
$('questions').addEventListener('click',e=>{let b=e.target.closest('button[data-check]');if(b)checkOne(Number(b.dataset.check))});$('chapter').addEventListener('change',e=>{selectedChapter=Number(e.target.value);reset()});$('mode').addEventListener('change',e=>{mode=e.target.value;reset()});$('restart').addEventListener('click',reset);$('finish').addEventListener('click',()=>{let qs=chapters[selectedChapter].questions,total=0;qs.forEach((q,i)=>{let a=answers[i]??getPicked(i);total+=score(q,a);$('f'+i).innerHTML=feedback(q,a)});submitted=true;document.querySelectorAll('input').forEach(x=>x.disabled=true);document.querySelectorAll('button[data-check]').forEach(x=>x.disabled=true);$('result').textContent=`${total} / ${qs.length*2} балл`;window.scrollTo({top:0,behavior:'smooth'})});
chapters.forEach((c,i)=>{$('chapter').add(new Option(`${i+1}-тарау · ${c.title} (${c.questions.length})`,i))});reset();
</script></body></html>
